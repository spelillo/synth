<div style="background:#fffefb;padding:40px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="max-width:420px;margin:0 auto;">
    <p style="font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#ff4f00;margin:0 0 20px;">Synth</p>
    <h1 style="font-size:20px;font-weight:700;color:#201515;margin:0 0 14px;">Confirm your account</h1>
    <p style="font-size:15px;line-height:1.6;color:#605d52;margin:0 0 24px;">Enter this code in Synth to finish creating your account:</p>
    <div style="background:#f8f4f0;border-radius:12px;padding:22px;text-align:center;margin:0 0 24px;">
      <span style="font-family:'SF Mono',Consolas,'Courier New',monospace;font-size:30px;font-weight:700;letter-spacing:6px;color:#201515;">{{ .Token }}</span>
    </div>
    <p style="font-size:13px;line-height:1.6;color:#939084;margin:0;">This code expires in an hour. If you didn't try to create a Synth account, you can ignore this email.</p>
  </div>
</div>
